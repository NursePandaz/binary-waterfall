name: Desktop packages
on:
  push:
    branches: [linux-all-fixes]
    paths-ignore: ['android/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-pyqt5 python3-pyqt5.qtmultimedia ffmpeg libgl1 libegl1 libpulse0 libqt5multimedia5-plugins gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
      - name: Build environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r packaging/requirements.txt
      - name: Unit and integration tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python -m binary_waterfall --self-test --report source-test.json
      - name: Build package
        run: |
          .venv/bin/python -m PyInstaller --noconfirm packaging/desktop.spec
          sh packaging/linux/build-deb.sh
      - name: Test installed package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y ./dist/*.deb
          binary-waterfall --self-test --report installed-test.json
          cp installed-test.json dist/verification-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/verification-*.json
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Dependencies and media tools
        shell: pwsh
        run: |
          python -m pip install -r packaging/requirements.txt PyQt5==5.15.11
          choco install ffmpeg --version=7.1.1 -y --no-progress
          New-Item -ItemType Directory -Force build/media
          $ffmpeg = Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName, $ffprobe.FullName build/media/
          Add-Content $env:GITHUB_PATH $ffmpeg.DirectoryName
      - name: Test and build
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          python -m binary_waterfall --self-test --report source-test.json
          python -m PyInstaller --noconfirm packaging/desktop.spec
      - name: Test standalone executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot"
          $p = Start-Process -FilePath ./dist/binary-waterfall-windows-x64.exe -ArgumentList '--self-test --report installed-test.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Executable test failed: $($p.ExitCode)" }
          $report = Get-Content installed-test.json | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Verification failed' }
          Copy-Item installed-test.json dist/verification-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/verification-*.json
          if-no-files-found: error
