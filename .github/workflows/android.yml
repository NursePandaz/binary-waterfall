name: Android preview
on:
  workflow_dispatch:
  push:
    branches: [android-preview]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and inspect Android preview
        run: gradle -p android --no-daemon lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise preview on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.nursepandaz.binarywaterfall/files/preview.png android/preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BinaryWaterfall-Android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/preview.png
          if-no-files-found: error
